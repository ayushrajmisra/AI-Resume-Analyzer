<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CareerCraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container glassmorphism">
        <div class="auth-header">
            <h2>Create Your CareerCraft Account</h2>
            <p>Join us to unlock your full career potential.</p>
        </div>
        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" name="email" required>
                <div class="error-message" id="signupEmailError"></div>
            </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="signupPassword" name="password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('signupPassword')">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="signupPasswordError"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            <button type="submit" class="btn btn-cta">Sign Up</button>
            <div class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
