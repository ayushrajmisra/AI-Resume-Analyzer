<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerCraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container glassmorphism">
        <div class="auth-header">
            <h2>Login to CareerCraft</h2>
            <p>Welcome back! Please enter your credentials.</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" name="email" required>
                <div class="error-message" id="loginEmailError"></div>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="loginPassword" name="password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('loginPassword')">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="loginPasswordError"></div>
            </div>
            <div class="forgot-password">
                <a href="#" onclick="alert('Forgot Password functionality coming soon!')">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-cta">Login</button>
            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
